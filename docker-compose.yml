version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_ai_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ai_research_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_IN_MEMORY=false
      - ENVIRONMENT=production
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  postgres:
    image: postgres:15-alpine
    container_name: enterprise_ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_research_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: enterprise_ai_redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise_ai_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  # Cloudflare Tunnel for 100% Free Instant Public Publishing
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: enterprise_ai_tunnel
    restart: unless-stopped
    command: tunnel --url http://app:8000
    depends_on:
      - app

volumes:
  postgres_data:
  qdrant_storage:

